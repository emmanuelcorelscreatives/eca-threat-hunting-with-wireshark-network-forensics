# Human-readable builder schema; authoritative validation is offline-builder.py.
type: object
required: [synthetic, version, events]
properties:
  synthetic: {const: true}
  version: {const: 1}
  events: {type: array, minItems: 1, maxItems: 60000}
# Each event requires ordered timezone-aware timestamp and builder-validated protocol fields.
# Addresses must belong to documentation-only IPv4 networks. No network traffic is sent.
